name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The current 3.10 macOS patch is available for Intel; ARM64 builds
          # in actions/python-versions stop at an older patch.
          - os: macos-latest
            python-version: "3.10"
            runner: macos-15-intel

    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify repository hygiene
        run: python scripts/verify_hygiene.py

      - name: Run unit and integration test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Install distribution build tools
        run: python -m pip install "setuptools==81.0.0" "wheel==0.47.0" "packaging==26.3"

      - name: Verify installed wheel and fresh local MCP server
        run: python scripts/qualification/installed_package.py --output build/ci-installed

      - name: Check for whitespace errors
        run: git diff --check
