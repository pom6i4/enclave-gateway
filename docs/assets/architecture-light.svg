<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 790" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .title-main { font-size: 15px; font-weight: 700; fill: #0F172A; letter-spacing: 0.3px; }
      .badge-top { font-size: 10.5px; font-weight: 600; fill: #0369A1; }
      .tier-title { font-size: 13px; font-weight: 700; fill: #0F172A; letter-spacing: 0.4px; }
      .tier-sub { font-size: 11px; font-weight: 600; }
      .card-title { font-size: 12.5px; font-weight: 700; }
      .card-line { font-size: 11px; fill: #475569; }
      .card-code { font-size: 10.3px; fill: #1E293B; }
      .pill-text { font-size: 10.8px; font-weight: 600; }
      .fw-text { font-size: 9.5px; font-weight: 700; fill: #DC2626; letter-spacing: 0.6px; }
    </style>

    <pattern id="eng-grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <linearGradient id="bg-grad-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <marker id="arrow-cyan-l" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow-amber-l" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-emerald-l" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple-l" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="2" y="2" width="836" height="786" rx="14" fill="url(#bg-grad-light)" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="2" y="2" width="836" height="786" rx="14" fill="url(#eng-grid-light)"/>

  <!-- Top Header Bar -->
  <rect x="2" y="2" width="836" height="48" rx="14" fill="#FFFFFF" opacity="0.95"/>
  <line x1="2" y1="50" x2="838" y2="50" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="24" cy="26" r="5" fill="#0284C7"/>
  <text x="38" y="31" class="font-sans title-main">ENCLAVE GATEWAY (egw) — L3–L7 ARCHITECTURE</text>
  <rect x="556" y="13" width="260" height="26" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
  <text x="686" y="30" text-anchor="middle" class="font-mono badge-top">HVF / KVM / WHPX • [MS-RDPEFS] • MCP</text>

  <!-- ===================================================================== -->
  <!-- TIER 1: HOST ENVIRONMENT                                              -->
  <!-- ===================================================================== -->
  <rect x="24" y="64" width="792" height="136" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="24" y="64" width="792" height="32" rx="10" fill="#E0F2FE"/>
  <text x="42" y="85" class="font-sans tier-title">1. HOST WORKSTATION</text>
  <text x="798" y="85" text-anchor="end" class="font-mono tier-sub" fill="#0369A1">macOS arm64 (HVF) • Linux 6.8+ (KVM) • Windows (WHPX)</text>

  <!-- Card 1.1: CLI -->
  <rect x="40" y="106" width="242" height="82" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="54" y="126" class="font-sans card-title" fill="#0369A1">CLI Orchestrator (egw)</text>
  <text x="54" y="146" class="font-mono card-code">init | up | down | status | top</text>
  <text x="54" y="164" class="font-mono card-code">exec | cp | tunnel | socks5 | heal</text>
  <text x="54" y="180" class="font-sans card-line">Unified multi-tier command router</text>

  <!-- Card 1.2: MCP Server -->
  <rect x="299" y="106" width="242" height="82" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="313" y="126" class="font-sans card-title" fill="#0369A1">MCP Server (JSON-RPC 2.0)</text>
  <text x="313" y="146" class="font-mono card-code">enclave_status | enclave_heal</text>
  <text x="313" y="164" class="font-mono card-code">node_exec | node_transfer | db</text>
  <text x="313" y="180" class="font-sans card-line">Zero-dependency stdio protocol</text>

  <!-- Card 1.3: Security & Audit -->
  <rect x="558" y="106" width="242" height="82" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="572" y="126" class="font-sans card-title" fill="#0369A1">Security &amp; FlightRecorder</text>
  <text x="572" y="146" class="font-mono card-code">SecretVault (OS Keychain + .env)</text>
  <text x="572" y="164" class="font-mono card-code">SecretScrubber + SQL/RM Guard</text>
  <text x="572" y="180" class="font-sans card-line">Audit trail in audit.jsonl</text>

  <!-- ===================================================================== -->
  <!-- CONNECTORS: HOST <-> APPLIANCE                                        -->
  <!-- ===================================================================== -->
  <line x1="230" y1="200" x2="230" y2="254" stroke="#0284C7" stroke-width="2" marker-start="url(#arrow-cyan-l)" marker-end="url(#arrow-cyan-l)"/>
  <rect x="68" y="214" width="324" height="26" rx="13" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.2"/>
  <text x="230" y="231" text-anchor="middle" class="font-mono pill-text" fill="#0369A1">virtio-serial (QGA + QMP ControlChannel)</text>

  <line x1="610" y1="200" x2="610" y2="254" stroke="#7C3AED" stroke-width="2" marker-start="url(#arrow-purple-l)" marker-end="url(#arrow-purple-l)"/>
  <rect x="442" y="214" width="336" height="26" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="610" y="231" text-anchor="middle" class="font-mono pill-text" fill="#6D28D9">TCP 127.0.0.1 (:1080 SOCKS5 / :13389 RDP)</text>

  <!-- ===================================================================== -->
  <!-- TIER 2: CRYPTOGRAPHIC APPLIANCE VM                                    -->
  <!-- ===================================================================== -->
  <rect x="24" y="256" width="792" height="140" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="24" y="256" width="792" height="32" rx="10" fill="#E0E7FF"/>
  <text x="42" y="277" class="font-sans tier-title">2. CRYPTOGRAPHIC APPLIANCE VM (@appliance)</text>
  <text x="798" y="277" text-anchor="end" class="font-mono tier-sub" fill="#4338CA">Isolated Guest OS • Golden qcow2 Snapshot</text>

  <!-- Card 2.1: VPN Provider -->
  <rect x="40" y="298" width="242" height="86" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="54" y="318" class="font-sans card-title" fill="#4338CA">VPN Crypto Provider</text>
  <text x="54" y="338" class="font-mono card-code">InfoTeCS ViPNet Client 5 / Custom</text>
  <text x="54" y="356" class="font-mono card-code">WINTUN-ARM64.SYS / x86_64 NDIS</text>
  <text x="54" y="373" class="font-sans card-line">Host kernel stays 100% clean</text>

  <!-- Card 2.2: Network & PMTUD Fix -->
  <rect x="299" y="298" width="242" height="86" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="313" y="318" class="font-sans card-title" fill="#4338CA">PMTUD &amp; RDP Policy Guard</text>
  <text x="313" y="338" class="font-mono card-code">Persistent MTU = 1350 (Infotecs)</text>
  <text x="313" y="356" class="font-mono card-code">fClientDisableUDP = 1 (Registry)</text>
  <text x="313" y="373" class="font-sans card-line">Eliminates 60s UDP frame drops</text>

  <!-- Card 2.3: Session Supervisor -->
  <rect x="558" y="298" width="242" height="86" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="572" y="318" class="font-sans card-title" fill="#4338CA">SessionSupervisor &amp; Spool</text>
  <text x="572" y="338" class="font-mono card-code">Interactive /it cmdkey Injector</text>
  <text x="572" y="356" class="font-mono card-code">C:\EnclaveGateway\spool</text>
  <text x="572" y="373" class="font-sans card-line">Auto-reconnects mstsc.exe</text>

  <!-- ===================================================================== -->
  <!-- CONNECTOR: APPLIANCE <-> BASTION (FIREWALL BOUNDARY)                  -->
  <!-- ===================================================================== -->
  <line x1="28" y1="426" x2="812" y2="426" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="5,5" stroke-opacity="0.7"/>
  <text x="34" y="420" class="font-mono fw-text">FIREWALL BOUNDARY</text>
  <text x="806" y="420" text-anchor="end" class="font-mono fw-text">ONLY TCP 3389 OPEN</text>

  <line x1="420" y1="396" x2="420" y2="456" stroke="#D97706" stroke-width="2.5" marker-start="url(#arrow-amber-l)" marker-end="url(#arrow-amber-l)"/>
  <rect x="200" y="413" width="440" height="26" rx="13" fill="#FFFFFF" stroke="#D97706" stroke-width="1.3"/>
  <text x="420" y="430" text-anchor="middle" class="font-mono pill-text" fill="#B45309">RDP [MS-RDPEFS / rdpdr]  ──  \\tsclient\C\EnclaveGateway\spool</text>

  <!-- ===================================================================== -->
  <!-- TIER 3: BASTION TERMINAL SERVER                                       -->
  <!-- ===================================================================== -->
  <rect x="24" y="458" width="792" height="140" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#D97706" stroke-width="1.5"/>
  <rect x="24" y="458" width="792" height="32" rx="10" fill="#FEF3C7"/>
  <text x="42" y="479" class="font-sans tier-title">3. BASTION JUMP HOST (@bastion — 10.0.1.10:3389)</text>
  <text x="798" y="479" text-anchor="end" class="font-mono tier-sub" fill="#B45309">BastionWorker • Warm In-Process Runspace</text>

  <!-- Card 3.1: Transactional Envelopes -->
  <rect x="40" y="500" width="242" height="86" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="54" y="520" class="font-sans card-title" fill="#B45309">RdpVfsTransport IPC</text>
  <text x="54" y="540" class="font-mono card-code">req_&lt;id&gt;.json ↔ res_&lt;id&gt;.json</text>
  <text x="54" y="558" class="font-mono card-code">&amp; ([scriptblock]::Create(...))</text>
  <text x="54" y="575" class="font-sans card-line">~200ms latency, zero child procs</text>

  <!-- Card 3.2: Parallel Striped I/O -->
  <rect x="299" y="500" width="242" height="86" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="313" y="520" class="font-sans card-title" fill="#B45309">Parallel Striped I/O</text>
  <text x="313" y="540" class="font-mono card-code">4 MB SHA-256 Block Delta Sync</text>
  <text x="313" y="558" class="font-mono card-code">RunspacePool + zlib DeflateStream</text>
  <text x="313" y="575" class="font-sans card-line">Concurrent random-access stripes</text>

  <!-- Card 3.3: SOCKS5 / TCP Multiplexer -->
  <rect x="558" y="500" width="242" height="86" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="572" y="520" class="font-sans card-title" fill="#B45309">SOCKS5 &amp; TCP Multiplexer</text>
  <text x="572" y="540" class="font-mono card-code">$Global:EnclaveMuxSockets Table</text>
  <text x="572" y="558" class="font-mono card-code">mux_open | mux_io | mux_close</text>
  <text x="572" y="575" class="font-sans card-line">Stateful bidirectional streams</text>

  <!-- ===================================================================== -->
  <!-- CONNECTORS: BASTION <-> TARGET NODES                                  -->
  <!-- ===================================================================== -->
  <line x1="220" y1="598" x2="220" y2="656" stroke="#059669" stroke-width="2" marker-start="url(#arrow-emerald-l)" marker-end="url(#arrow-emerald-l)"/>
  <rect x="40" y="614" width="360" height="26" rx="13" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
  <text x="220" y="631" text-anchor="middle" class="font-mono pill-text" fill="#047857">OpenSSH / SCP (Base64 + CR-strip + sudo -S)</text>

  <line x1="620" y1="598" x2="620" y2="656" stroke="#059669" stroke-width="2" marker-start="url(#arrow-emerald-l)" marker-end="url(#arrow-emerald-l)"/>
  <rect x="440" y="614" width="360" height="26" rx="13" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
  <text x="620" y="631" text-anchor="middle" class="font-mono pill-text" fill="#047857">Multiplexed SOCKS5 (RFC 1928) &amp; TCP Relay</text>

  <!-- ===================================================================== -->
  <!-- TIER 4: UPSTREAM TARGET NODES                                         -->
  <!-- ===================================================================== -->
  <!-- Target 1: app01 -->
  <rect x="24" y="658" width="384" height="112" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#059669" stroke-width="1.5"/>
  <rect x="24" y="658" width="384" height="30" rx="10" fill="#D1FAE5"/>
  <text x="40" y="678" class="font-sans tier-title">4A. TARGET NODE: app01</text>
  <text x="392" y="678" text-anchor="end" class="font-mono tier-sub" fill="#047857">10.0.20.11:22</text>
  <text x="40" y="706" class="font-sans card-line" fill="#334155">Linux Application Host • Docker • PostgreSQL / MySQL</text>
  <text x="40" y="728" class="font-mono card-code" fill="#047857">$ egw exec app01 --sudo "systemctl status docker"</text>
  <text x="40" y="748" class="font-mono card-code" fill="#047857">$ egw cp ./release.tar.gz app01:/tmp/release.tar.gz</text>

  <!-- Target 2: auth01 -->
  <rect x="432" y="658" width="384" height="112" rx="10" fill="#FFFFFF" fill-opacity="0.95" stroke="#059669" stroke-width="1.5"/>
  <rect x="432" y="658" width="384" height="30" rx="10" fill="#D1FAE5"/>
  <text x="448" y="678" class="font-sans tier-title">4B. TARGET NODE: auth01</text>
  <text x="800" y="678" text-anchor="end" class="font-mono tier-sub" fill="#047857">10.0.20.12:443</text>
  <text x="448" y="706" class="font-sans card-line" fill="#334155">Internal Web / IAM / API Services • Isolated Subnets</text>
  <text x="448" y="728" class="font-mono card-code" fill="#047857">$ egw socks5 --port 1080</text>
  <text x="448" y="748" class="font-mono card-code" fill="#047857">$ egw tunnel 8443:auth01:443</text>
</svg>
