# Standard: one trusted operator, approved RDP session and key-based SSH.
# Existing configs without security.mode keep their previous custom defaults.
# For signed isolation use enclave.enterprise.example.yaml and docs/SECURITY.md.
profile: default
security:
  mode: standard

appliance:
  name: enclave-appliance
  hypervisor: auto                # Existing managed Windows VM; direct for Windows Host
  arch: auto                      # Guest and accelerator architectures must match
  mtu: 1200                       # Managed Windows IPv4 MTU; applied by egw heal
  disk_path: ~/.local/share/enclave-gateway/disk.qcow2
  efi_vars_path: ~/.local/share/enclave-gateway/efi_vars.fd
  # Optional control paths; appliance.name remains the verified QMP VM name.
  attach_only: null               # Auto: explicit paths attach; false manages paths inside runtime_dir
  qga_socket_path: ''
  qmp_socket_path: ''
  pid_file_path: ''
  # runtime_dir: /tmp/enclave-gateway-run  # Private directory; short UNIX socket paths

# Use the existing approved VPN connection. No installer or key import by default.
provider:
  type: custom                   # custom | vipnet | kontinent | anyconnect | openvpn | wireguard
  installer_path: ''
  dst_key_path: ''
  probe_host: ''                  # Follows bastion.host; explicit for a different probe
  probe_port: 0                   # Follows bastion.port

bastion:
  # Optional persistent redirected-file channel; see docs/GUIDE.md latency section.
  spool_protocol: files
  enabled: true
  host: 10.0.1.10
  port: 3389
  heartbeat_max_age_sec: 45       # Liveness hint, separate from Enterprise attestation
  appliance_spool_dir: 'C:\EnclaveGateway\spool'
  bastion_spool_dir: '\\tsclient\C\EnclaveGateway\spool'

targets:
  app01:
    host: 10.0.20.11
    user: deploy
    via: bastion                  # Or appliance; a TargetNode alias supports further hops
    os: linux
    ssh_key_path: '~/.ssh/id_ed25519'  # Private key ON THE HOP, not on your Host
    # ssh_known_hosts_path: 'C:\Users\operator\.ssh\known_hosts'

forwards:
  app_https: '18443:app01:443'      # Loopback listener
