# Foreground profile. Deployment approval and independently verified pins are required.
appliance:
  mtu: 1200
security:
  mode: standard
  require_signed_agents: true
  enforce_worker_attestation: true
  agent_package_dir: './approved-agents'
  worker_sha256: ''
  worker_account: '' # Required for an unsigned operator adapter. Use the Windows SID.
  trusted_signers: []
bastion:
  host: '10.0.1.10'
  execution_profile: structured_only
  structured_backend: spawn # operator requires Stream and a dedicated approved target.
  spool_protocol: files
  worker_policy_path: 'C:\ProgramData\EnclaveGateway\worker-policy.json'
  worker_policy_sha256: ''
  lease_seconds: 28800
provider:
  type: custom
  installer_path: ''
  dst_key_path: ''
targets:
  app01:
    host: '10.0.20.11'
    user: deploy
    via: bastion
