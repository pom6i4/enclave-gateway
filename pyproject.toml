[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enclave-gateway"
version = "0.3.0b4"
description = "Cross-platform cryptographic appliance orchestrator, RDP Virtual-Channel (MS-RDPEFS) relay, multi-hop SSH router, and MCP server for isolated network enclaves."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Roman Kuligin" }
]
keywords = [
  "vipnet",
  "kontinent",
  "anyconnect",
  "openvpn",
  "wireguard",
  "socks5",
  "ssh",
  "model-context-protocol",
  "qga",
  "air-gapped",
  "enclave",
  "gateway",
  "bastion",
  "rdp",
  "rdpdr",
  "qemu",
  "hvf",
  "kvm",
  "mcp",
  "vpn"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pom6i4/enclave-gateway"
Repository = "https://github.com/pom6i4/enclave-gateway"
Documentation = "https://github.com/pom6i4/enclave-gateway/blob/main/docs/GUIDE.md"
Issues = "https://github.com/pom6i4/enclave-gateway/issues"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.4"]
release = ["jsonschema>=4.25,<5"]

[project.scripts]
egw = "enclave_gateway.cli:main"
enclave-gateway = "enclave_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enclave_gateway = ["agents/*.ps1", "agents/*.py", "provision/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
